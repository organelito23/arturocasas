name: monitor

on:
  workflow_dispatch:
    inputs:
      minutos:
        description: "minutos de monitor"
        default: "300"
  schedule:
    - cron: "17 */6 * * *"   # respaldo por si la cadena se corta

concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      MINUTOS: ${{ github.event.inputs.minutos || '300' }}
      HELIUS_API_KEY: ${{ secrets.HELIUS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Dejar en fila la siguiente corrida (arranca sola cuando esta termine, pase lo que pase)
        if: env.MINUTOS == '300'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install websockets requests
      - name: Monitor (papel), guardando cada 30 min
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          save() {
            git add monitor.csv graduadas.csv log_monitor.txt 2>/dev/null || true
            git commit -qm "monitor $(date -u +%F_%H%M)" && git pull -q --rebase -X theirs && git push -q || true
          }
          python -u monitor.py >> log_monitor.txt 2>&1 &
          PID=$!
          END=$((SECONDS + MINUTOS * 60))
          while [ $SECONDS -lt $END ] && kill -0 $PID 2>/dev/null; do
            LEFT=$((END - SECONDS))
            sleep $(( LEFT < 1800 ? LEFT : 1800 ))
            save
          done
          kill $PID 2>/dev/null || true
      - name: Guardar datos del monitor
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add monitor.csv graduadas.csv log_monitor.txt 2>/dev/null || true
          git commit -m "monitor $(date -u +%F_%H%M)" || exit 0
          git pull --rebase -X theirs && git push
      - name: Test sin sesgo de las graduadas
        if: always()
        run: |
          if [ -f graduadas.csv ]; then
            timeout 1500 python -u memes.py --mints graduadas.csv > resultados_memes.txt 2>log_memes.txt || true
          fi
      - name: Guardar test
        if: always()
        run: |
          git add resultados_memes.txt 2>/dev/null || true
          git commit -m "memes $(date -u +%F_%H%M)" || exit 0
          git pull --rebase -X theirs && git push
