name: sweep
on: workflow_dispatch
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - uses: actions/cache@v4
        with:
          path: cache_memes
          key: memes-cache-${{ github.run_id }}
          restore-keys: memes-cache-
      - run: |
          for f in 0.02 0.01; do
            timeout 1500 python -u sweep.py --fee $f --budget 1200 > sweep_fee_$f.txt 2>log_sweep.txt || true
          done
      - run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add sweep_fee_*.txt log_sweep.txt
          git commit -m "sweep $(date -u +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
